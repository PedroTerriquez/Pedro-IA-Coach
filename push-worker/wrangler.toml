name = "coach-pedro-ai"
main = "src/index.js"
compatibility_date = "2025-05-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "PUSH_KV"
id = "96139c40523448939c29acf202c4ff16"

[[kv_namespaces]]
binding = "UNMATCHED_KV"
id = "c75316ad7be84b9da8915454566129b0"

[[d1_databases]]
binding = "DB"
database_name = "coach-pedro-db"
database_id = "5d89da43-8a90-4ddc-9b96-a795b67a054a"
migrations_dir = "migrations"

[vars]
VAPID_EMAIL = "mailto:pedro@example.com"

[[queues.producers]]
binding = "REST_TIMER_QUEUE"
queue = "rest-timers"

[[queues.consumers]]
queue = "rest-timers"
max_batch_size = 1
max_batch_timeout = 5
