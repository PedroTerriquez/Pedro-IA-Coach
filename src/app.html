<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
  <!-- Self-hosted (static/fonts) so they're precached and work offline -->
  <style>
    @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 300 700; font-display: swap; src: url(%sveltekit.assets%/fonts/space-grotesk.woff2) format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 800; font-display: swap; src: url(%sveltekit.assets%/fonts/jetbrains-mono.woff2) format('woff2'); }
  </style>
  %sveltekit.head%
</head>
<body data-sveltekit-prerender="true">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
